<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather & Expense Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #38bdf8;
            --success: #34d399;
            --highlight: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }

        header p {
            color: var(--muted);
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card h2 {
            font-size: 1.25rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label {
            font-size: 0.85rem;
            color: var(--muted);
        }

        input {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: #0f172a;
            border: none;
            padding: 0.7rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.3rem;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Polished Weather Display */
        .weather-display {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            min-height: 120px;
            justify-content: center;
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .weather-location {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
        }

        .weather-condition {
            font-size: 0.85rem;
            color: var(--highlight);
            font-weight: 500;
        }

        .weather-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 0.25rem;
        }

        .stat-item {
            background: #1e293b;
            padding: 0.6rem;
            border-radius: 6px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            margin-top: 0.2rem;
        }

        .weather-placeholder {
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .summary-badge {
            display: inline-block;
            background: #064e3b;
            color: var(--success);
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        th,
        td {
            text-align: left;
            padding: 0.6rem;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--muted);
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Dual Dashboard</h1>
            <p>Clean Interface for Weather Query & Expense Tracking</p>
        </header>

        <div class="grid">
            <!-- Section 1: Weather Service -->
            <section class="card">
                <h2>🌤️ Weather Lookup</h2>
                <div class="form-group">
                    <label>Search by City, State, or Country</label>
                    <input type="text" id="cityName" placeholder="e.g. Kolkata, London, Tokyo" value="Kolkata">
                </div>
                <button onclick="searchCityWeather()">Search Weather</button>
                <div id="weatherDisplay" class="weather-display">
                    <div class="weather-placeholder">Type a city name and click Search</div>
                </div>
            </section>

            <!-- Section 2: Log New Expense -->
            <section class="card">
                <h2>💸 Add Expense</h2>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="expTitle" placeholder="e.g. Chai & Snacks">
                </div>
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" id="expAmount" step="0.5" placeholder="e.g. 40.0">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="expCategory" placeholder="e.g. Food">
                </div>
                <button onclick="addExpense()">Save Expense</button>
                <div id="expenseStatus" style="font-size: 0.85rem; color: var(--muted);"></div>
            </section>
        </div>

        <!-- Section 3: Expense Records & Summary -->
        <section class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>📊 Expenses History</h2>
                <div id="totalBadge" class="summary-badge">Total: ₹0.00</div>
            </div>
            <table id="expensesTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Amount (₹)</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="expensesBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--muted);">No expenses logged yet.</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

    <script>
        // Translate raw WMO numeric codes into clear human descriptions
        function getWmoDescription(code) {
            const codeMap = {
                0: "☀️ Clear Sky",
                1: "🌤️ Mainly Clear",
                2: "⛅ Partly Cloudy",
                3: "☁️ Overcast",
                45: "🌫️ Foggy",
                48: "🌫️ Depositing Rime Fog",
                51: "🌦️ Light Drizzle",
                53: "🌦️ Moderate Drizzle",
                55: "🌧️ Dense Drizzle",
                61: "🌧️ Slight Rain",
                63: "🌧️ Moderate Rain",
                65: "🌧️ Heavy Rain",
                71: "🌨️ Slight Snow Fall",
                73: "🌨️ Moderate Snow Fall",
                75: "❄️ Heavy Snow Fall",
                80: "🌦️ Slight Rain Showers",
                81: "🌧️ Moderate Showers",
                82: "⛈️ Violent Rain Showers",
                95: "⚡ Thunderstorm",
                96: "⛈️ Thunderstorm with Hail"
            };
            return codeMap[code] || `Weather Code ${code}`;
        }

        async function searchCityWeather() {
            const city = document.getElementById('cityName').value.trim();
            const display = document.getElementById('weatherDisplay');
            if (!city) {
                display.innerHTML = '<div class="weather-placeholder">Please enter a location name.</div>';
                return;
            }
            display.innerHTML = '<div class="weather-placeholder">Searching location and fetching live weather...</div>';
            try {
                const res = await fetch(`/weather/search?location_name=${encodeURIComponent(city)}`);
                if (!res.ok) {
                    const err = await res.json();
                    display.innerHTML = `<div class="weather-placeholder" style="color: #ef4444;">${err.detail || "Location not found."}</div>`;
                    return;
                }
                const data = await res.json();
                const conditionText = getWmoDescription(data.weather.weather_code);

                display.innerHTML = `
          <div class="weather-header">
            <span class="weather-location">📍 ${data.location}</span>
            <span class="weather-condition">${conditionText}</span>
          </div>
          <div class="weather-stats">
            <div class="stat-item">
              <div class="stat-label">Temperature</div>
              <div class="stat-value">${data.weather.temperature_c}°C</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Wind Speed</div>
              <div class="stat-value">${data.weather.wind_speed_kmh} <span style="font-size: 0.8rem; font-weight: normal;">km/h</span></div>
            </div>
          </div>
        `;
            } catch (err) {
                display.innerHTML = '<div class="weather-placeholder" style="color: #ef4444;">Network error. Weather service is unreachable.</div>';
            }
        }

        async function loadExpenses() {
            try {
                const [listRes, sumRes] = await Promise.all([
                    fetch('/expenses'),
                    fetch('/expenses/summary')
                ]);
                const expenses = await listRes.json();
                const summary = await sumRes.json();

                document.getElementById('totalBadge').textContent = `Total: ₹${summary.total_amount.toFixed(2)} (${summary.expense_count} items)`;

                const tbody = document.getElementById('expensesBody');
                if (expenses.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--muted);">No expenses logged yet.</td></tr>';
                    return;
                }
                tbody.innerHTML = expenses.map(e => `
          <tr>
            <td>#${e.id}</td>
            <td><strong>${e.title}</strong></td>
            <td>${e.category}</td>
            <td>₹${e.amount.toFixed(2)}</td>
            <td>${new Date(e.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
          </tr>
        `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function addExpense() {
            const title = document.getElementById('expTitle').value;
            const amount = parseFloat(document.getElementById('expAmount').value);
            const category = document.getElementById('expCategory').value;
            const statusBox = document.getElementById('expenseStatus');

            if (!title || isNaN(amount) || !category) {
                statusBox.textContent = "Please fill in all fields.";
                return;
            }

            try {
                const res = await fetch('/expenses', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, amount, category })
                });
                if (!res.ok) {
                    const err = await res.json();
                    statusBox.textContent = err.detail?.[0]?.msg || "Validation error";
                    return;
                }
                document.getElementById('expTitle').value = '';
                document.getElementById('expAmount').value = '';
                document.getElementById('expCategory').value = '';
                statusBox.textContent = "Expense added successfully!";
                loadExpenses();
            } catch (err) {
                statusBox.textContent = "Failed to save expense.";
            }
        }

        loadExpenses();
    </script>
</body>

</html>
